---
- name: Launch database container
  community.docker.docker_container:
    name: postgres
    image: romainnn/devops_postgres:latest
    env:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd
    networks:
      - name: app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    state: started
    restart_policy: always
