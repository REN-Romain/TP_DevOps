version: '3.8'

services:
  backend:
    build: .
    container_name: java-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
    networks:
      - proxy-network
      - app-network
    depends_on:
      database:
        condition: service_healthy

  database:
    build: ./postgres
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr"]
      interval: 10s
      timeout: 5s
      retries: 5

  front:
    build: ./front
    container_name: front
    networks:
      - proxy-network
    depends_on:
      backend:
        condition: service_started

  httpd:
    build: ./http
    container_name: apache
    ports:
      - "80:80"
    networks:
      - proxy-network
    depends_on:
      front:
        condition: service_started

networks:
  proxy-network:
  app-network:

volumes:
  postgres_data: